<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IELTS Picker Preview Options</title>
  <style>
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#101828;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 20px;color:#475467}.sheet{width:100%;max-width:980px;border-radius:18px;box-shadow:0 18px 45px rgba(16,24,40,.16);display:block}.grid{display:grid;gap:18px;max-width:980px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{background:white;border-radius:16px;padding:14px;box-shadow:0 10px 28px rgba(16,24,40,.1)}.option h2{margin:0 0 10px;font-size:22px}.option img{width:100%;border-radius:12px;display:block}@media(max-width:700px){body{padding:16px}.row{grid-template-columns:1fr}h1{font-size:24px}}
  </style>
</head>
<body>
  <h1>IELTS card image previews</h1>
  <p>Reply A, B, or C.</p>
  <img class="sheet" src="/picker-options/ielts_picker_preview_sheet.jpg" alt="IELTS picker preview sheet with options A, B, and C">
  <div class="grid" style="margin-top:24px">
    <div class="option"><h2>A — Flat illustration</h2><div class="row"><img src="/picker-options/picker_academic_flat.jpg" alt="Academic flat illustration"><img src="/picker-options/picker_general_flat.jpg" alt="General flat illustration"></div></div>
    <div class="option"><h2>B — 3D clay render</h2><div class="row"><img src="/picker-options/picker_academic_3d.jpg" alt="Academic 3D render"><img src="/picker-options/picker_general_3d.jpg" alt="General 3D render"></div></div>
    <div class="option"><h2>C — Cinematic photo</h2><div class="row"><img src="/picker-options/picker_academic_photo.jpg" alt="Academic cinematic photo"><img src="/picker-options/picker_general_photo.jpg" alt="General cinematic photo"></div></div>
  </div>
</body>
</html>
